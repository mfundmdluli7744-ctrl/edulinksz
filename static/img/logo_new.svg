<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#152B47;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A7203B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B1A31;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield/Shape -->
  <path d="M256 40 L440 120 L440 280 C440 380 360 460 256 472 C152 460 72 380 72 280 L72 120 Z" fill="url(#mainBlue)" filter="url(#shadow)" />
  
  <!-- Stylized 'E' -->
  <g transform="translate(166, 156) scale(1.1)">
    <!-- Top Bar -->
    <rect x="0" y="0" width="160" height="30" rx="4" fill="#FFD700" />
    <!-- Middle Bar -->
    <rect x="0" y="75" width="120" height="30" rx="4" fill="url(#accentRed)" />
    <!-- Bottom Bar -->
    <rect x="0" y="150" width="160" height="30" rx="4" fill="#FFD700" />
    <!-- Vertical Bar -->
    <rect x="0" y="0" width="35" height="180" rx="4" fill="white" />
  </g>
  
  <!-- Academic Cap Icon (Subtle Overlay) -->
  <path d="M256 100 L320 130 L256 160 L192 130 Z" fill="white" opacity="0.9" />
  <path d="M320 130 L320 160 C320 160 290 180 256 180 C222 180 192 160 192 160 L192 130" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9" />
</svg>
